server.port=8080
spring.application.name=plataforma-resenas-backend

# Configuración de Perfil Activo (por defecto h2 para ejecución directa y pruebas sin depender del servicio MySQL local detenido)
# Cambiar a SPRING_PROFILES_ACTIVE=mysql para conectar directamente al servidor MySQL 8.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Configuración JWT
app.jwt.secret=${JWT_SECRET_BASE64:dGhpcy1pcy1hLXNhbXBsZS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktMjU2LWJpdHM=}
app.jwt.expiration-seconds=86400

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JPA general
spring.jpa.open-in-view=false
