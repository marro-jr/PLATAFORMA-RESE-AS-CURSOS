server.port=${SERVER_PORT:8080}
spring.application.name=plataforma-resenas-backend

# Carga de variables de entorno desde archivo .env local si existe (ignorado por control de versiones)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Configuración de Perfil Activo (por defecto dev para desarrollo local con seed data; en prod nunca se cargan usuarios con claves conocidas)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuración JWT: la clave secreta se inyecta estrictamente mediante variable de entorno
app.jwt.secret=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Configuración CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JPA general
spring.jpa.open-in-view=false
